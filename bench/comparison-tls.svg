<svg xmlns="http://www.w3.org/2000/svg" width="820" height="591" viewBox="0 0 820 591" role="img" aria-labelledby="t d">
<title id="t">Requests per second over TLS, each cache in front of the same upstream, server on 8 cores</title>
<desc id="d">Horizontal bars for a 13-byte text and a 42KiB image. Over TLS, this module serves about three quarters of what nginx does, on a par with Varnish behind hitch; caddyserver/cache-handler is far behind on the image.</desc>
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #52514e; }
  .title { font-size: 15px; font-weight: 600; fill: #0b0b0b; }
  .panel { font-size: 13px; font-weight: 600; fill: #0b0b0b; }
  .label { fill: #0b0b0b; }
  .value { fill: #52514e; font-variant-numeric: tabular-nums; }
  .cache { fill: #2a78d6; }
  .none { fill: #eb6834; }
  .axis { stroke: #d9d8d3; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    text { fill: #c3c2b7; }
    .title, .panel, .label { fill: #ffffff; }
    .value { fill: #c3c2b7; }
    .cache { fill: #3987e5; }
    .none { fill: #d95926; }
    .axis { stroke: #3a3a37; }
  }
</style>
<text x="0" y="24" class="title">Requests per second over TLS, server on 8 cores</text>
<text x="0" y="43">Ryzen 9 9900X, 64 keep-alive connections, median of 3 runs of 100,000 requests. Every cache is in front of the same upstream, a Caddy without a cache.</text>
