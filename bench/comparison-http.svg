<svg xmlns="http://www.w3.org/2000/svg" width="820" height="603" viewBox="0 0 820 603" role="img" aria-labelledby="t d">
<title id="t">Requests per second in plain HTTP, server on 8 cores</title>
<desc id="d">Horizontal bars for a 13-byte text and a 42KiB image. In plain HTTP, nginx and Varnish serve the image about 1.4 times as fast as this module, which serves it 1.6 times as fast as Caddy's own file_server; caddyserver/cache-handler is far behind on the image.</desc>
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #52514e; }
  .title { font-size: 15px; font-weight: 600; fill: #0b0b0b; }
  .panel { font-size: 13px; font-weight: 600; fill: #0b0b0b; }
  .label { fill: #0b0b0b; }
  .value { fill: #52514e; font-variant-numeric: tabular-nums; }
  .cache { fill: #2a78d6; }
  .none { fill: #eb6834; }
  .axis { stroke: #d9d8d3; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    text { fill: #c3c2b7; }
    .title, .panel, .label { fill: #ffffff; }
    .value { fill: #c3c2b7; }
    .cache { fill: #3987e5; }
    .none { fill: #d95926; }
    .axis { stroke: #3a3a37; }
  }
</style>
<text x="0" y="24" class="title">Requests per second in plain HTTP, server on 8 cores</text>
<text x="0" y="43">Ryzen 9 9900X, 64 keep-alive connections, median of 3 runs of 100,000 requests. Every cache is in front of the same upstream, a Caddy without a cache.</text>
<rect x="0" y="57" width="12" height="12" rx="3" class="cache"/>
<text x="18" y="67">Served from the cache</text>
<rect x="172.20000000000002" y="57" width="12" height="12" rx="3" class="none"/>
<text x="190.20000000000002" y="67">No cache: the upstream through the same server</text>
<text x="0" y="97" class="panel">Text, 13 bytes</text>
<text x="238" y="122" text-anchor="end" class="label">This module</text>
<path class="cache" d="M250,111 h358.5 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-358.5 z"/>
<text x="622.5" y="122" class="value">332k</text>
<text x="238" y="148" text-anchor="end" class="label">This module, max_memory off</text>
<path class="cache" d="M250,137 h288.7 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-288.7 z"/>
<text x="552.7" y="148" class="value">268k</text>
<text x="238" y="174" text-anchor="end" class="label">caddyserver/cache-handler, Otter</text>
